# No version needed since working with: Docker Compose V2

volumes:
    mariadb:
    wordpress-db:
    wordpress-files:

networks:
    inception-network:
        driver: bridge
        name: inception-network

services:
    nginx:
        container_name: nginx
        restart: unless-stopped
        build: ./requirements/nginx

        env_file:
            - .env
        ports:
            - "443:443"
        depends_on:
            - wordpress
        networks:
            - inception-network
        volumes:
            - wordpress-files:/var/www/html
        environment:
            - DOMAIN_NAME=${DOMAIN_NAME}

    mariadb:
        container_name: mariadb
        restart: unless-stopped
        build: ./requirements/mariadb

        env_file:
            - .env
        networks:
            - inception-network
        volumes:
            - mariadb:/var/lib/mysql

    wordpress:
        restart: unless-stopped
        container_name: wordpress
        build: ./requirements/wordpress

        env_file:
            - .env
        depends_on:
            - mariadb
        networks:
            - inception-network
        volumes:
            - wordpress-files:/var/www/html

