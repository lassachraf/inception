services:

  mariadb:
    image: mariadb
    restart: always
    container_name: mariadb
    build: ./requirements/mariadb
    networks:
      - inception_network
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt
      - ../secrets/root_passwords.txt

  wordpress:
    restart: always
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
    networks:
      - inception_network
    volumes:
      - wp_data:/var/www/wordpress
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt
      - ../secrets/root_passwords.txt

  nginx:
    image: nginx
    restart: always
    container_name: nginx
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wp_data:/var/www/wordpress
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt
      - ../secrets/root_passwords.txt

  ftp:
    image: ftp
    restart: always
    container_name: ftp
    build: ./requirements/bonus/ftp
    ports:
      - "21:21"
      - "30000-30010:30000-30010"
    networks:
      - inception_network
    volumes:
      - wp_data:/var/www/wordpress
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt

  redis:
    image: redis
    restart: always
    container_name: redis
    build: ./requirements/bonus/redis
    networks:
      - inception_network
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt

  adminer:
    image: adminer
    restart: always
    container_name: adminer
    build: ./requirements/bonus/adminer
    networks:
      - inception_network
    ports:
      - "8080:8080"
    env_file:
      - .env
      - ../secrets/passwords.txt
      - ../secrets/credentials.txt
      - ../secrets/root_passwords.txt

  website:
    image: website
    restart: always
    container_name: website
    build: ./requirements/bonus/website
    networks:
      - inception_network
    ports:
      - "80:80"

  portainer:
    restart: always
    image: portainer
    container_name: portainer
    build: ./requirements/bonus/portainer
    ports:
      - "9999:9999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ptr_data:/data
    networks:
      - inception_network

networks:
  inception_network:
    name: inception_network

volumes:
  wp_data:
    driver: local
    name: 'wp_data'
    driver_opts:
      o: 'bind'
      type: 'none'
      device: '/home/itsmeachraf/data/wordpress'

  db_data:
    driver: local
    name: 'db_data'
    driver_opts:
      o: 'bind'
      type: 'none'
      device: '/home/itsmeachraf/data/mariadb'

  ptr_data:
    driver: local
    name: 'ptr_data'
    driver_opts:
      o: 'bind'
      type: 'none'
      device: '/home/itsmeachraf/data/portainer'
