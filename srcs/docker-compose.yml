services:

  mariadb:
    image: mariadb
    env_file: .env
    restart: always
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    env_file: .env
    restart: always
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network

  nginx:
    image: nginx
    container_name: nginx
    build: ./requirements/nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/wordpress
    env_file: .env
    networks:
      - inception_network

networks:
  inception_network:
    driver: bridge
    name: inception_network

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/alassiqu/data/wordpress' #1337_path
      # device: '/home/itsmeachraf/missi/wordpress' #home_path
  db_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/alassiqu/data/mariadb' #1337_path
      # device: '/home/itsmeachraf/missi/mariadb' #home_path
